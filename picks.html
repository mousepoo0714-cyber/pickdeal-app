<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<title>서·운·아빠 PICK DEAL</title>
<meta property="og:title" content="서·운·아빠 PICK DEAL">
<meta property="og:description" content="영상에서 본 번호를 눌러 바로 확인하세요">
<link rel="icon" href="icon-192.png">
<style>
:root{--y:#FFC93C;--n:#1B2A4A;--r:#E8423F;--bg:#F6F4EE;--card:#fff;--tx:#1B2A4A;--sub:#6E7180;--line:#E7E3D8}
@media (prefers-color-scheme:dark){:root{--bg:#10141f;--card:#1a2030;--tx:#EEF0F5;--sub:#9AA3B5;--line:#2A3245}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{background:var(--y);color:var(--n);padding:calc(18px + env(safe-area-inset-top)) 16px 18px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:20px;letter-spacing:-.3px}
.brand svg{width:44px;height:auto}
header p{margin:6px 0 0;font-size:14px;font-weight:600}
.search{position:sticky;top:0;z-index:3;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line)}
.search input{width:100%;border:2px solid var(--n);border-radius:14px;padding:12px 14px;font:700 17px inherit;background:var(--card);color:var(--tx)}
@media (prefers-color-scheme:dark){.search input{border-color:var(--y)}}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.note{font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;text-decoration:none;color:inherit;scroll-margin-top:90px;transition:box-shadow .2s}
.item.hl{box-shadow:0 0 0 3px var(--r)}
.no{flex:none;width:52px;height:52px;border-radius:14px;background:var(--n);color:var(--y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
.item img{flex:none;width:72px;height:72px;border-radius:12px;object-fit:cover;background:#fff}
.txt{flex:1;min-width:0}
.nm{font-weight:800;font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln{font-size:13px;color:var(--sub);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.go{display:inline-block;margin-top:6px;font-size:13px;font-weight:800;color:var(--r)}
.date{font-size:12px;color:var(--sub);margin:16px 2px 8px;font-weight:700}
.stats{display:inline-block;margin-top:10px;background:rgba(27,42,74,.1);border-radius:20px;padding:4px 14px;font-size:13px;font-weight:600}
.stats b{font-weight:900}
.stats[hidden]{display:none}
.empty{text-align:center;color:var(--sub);padding:40px 0}
footer{text-align:center;font-size:12px;color:var(--sub);padding:0 16px 30px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 200 90" aria-hidden="true"><rect x="0" y="30" width="200" height="40" rx="10" fill="#1B2A4A"/><rect x="4" y="0" width="141" height="34" rx="8" fill="#1B2A4A"/><polygon points="140,0 150,0 172,32 140,34" fill="#1B2A4A"/><rect x="12" y="7" width="32" height="20" rx="3" fill="#BFE3F5"/><rect x="50" y="7" width="32" height="20" rx="3" fill="#BFE3F5"/><rect x="88" y="7" width="32" height="20" rx="3" fill="#BFE3F5"/><circle cx="45" cy="72" r="17" fill="#111"/><circle cx="160" cy="72" r="17" fill="#111"/><circle cx="45" cy="72" r="7" fill="#ddd"/><circle cx="160" cy="72" r="7" fill="#ddd"/></svg>
    서·운·아빠 PICK DEAL
  </div>
  <p>영상에서 본 번호를 찾아 눌러주세요 👇</p>
  <div class="stats" id="stats" hidden>👀 오늘 <b id="vToday">-</b>명 · 누적 <b id="vTotal">-</b>명</div>
</header>
<div class="search"><input id="q" type="search" inputmode="numeric" placeholder="번호 입력 (예: 12)" autocomplete="off"></div>
<main>
  <div class="note">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다. 가격과 할인은 시점에 따라 달라질 수 있으니 쿠팡에서 확인해주세요.</div>
  <div id="list"><p class="empty">불러오는 중...</p></div>
</main>
<footer>서·운·아빠 PICK DEAL · 스레드 @imuro_hotshopping</footer>
<script>
// 방문자 통계 (GoatCounter). 가입할 때 정한 코드로 바꾸면 돼요.
const GC_CODE = 'pickdeal';
(function () {
  // 도메인 포워딩이 프레임 방식이어도 세도록, 경로는 하나로 고정
  window.goatcounter = { allow_frame: true, allow_local: true, path: '/picks' };
  const s = document.createElement('script');
  s.async = true; s.src = 'https://gc.zgo.at/count.js';
  s.dataset.goatcounter = `https://${GC_CODE}.goatcounter.com/count`;
  document.head.appendChild(s);
  const d = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); // 한국 날짜
  const get = q => fetch(`https://${GC_CODE}.goatcounter.com/counter/%2Fpicks.json${q}`, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : (r.status === 404 ? { count: '0' } : null)).catch(() => null);
  const box = document.getElementById('stats');
  Promise.all([get(`?start=${d}&end=${d}`), get('')]).then(([t, a]) => {
    if (a) {
      document.getElementById('vToday').textContent = t?.count || '0';
      document.getElementById('vTotal').textContent = a.count || '0';
      box.hidden = false;
      return;
    }
    // 예비: GoatCounter 공식 위젯으로 표시
    let tries = 0;
    const iv = setInterval(() => {
      if (++tries > 50) return clearInterval(iv);
      if (!(window.goatcounter && window.goatcounter.visit_count)) return;
      clearInterval(iv);
      box.innerHTML = '👀 오늘 <span id="gcT"></span>명 · 누적 <span id="gcA"></span>명';
      box.hidden = false;
      const st = 'body{margin:0;background:transparent}#gcvc{border:0;padding:0;background:transparent;font:900 13px sans-serif;color:#1B2A4A;text-align:left}#gcvc-for,#gcvc-by{display:none}#gcvc-views{font-size:13px;line-height:18px}';
      const opt = { type: 'html', path: '/picks', no_branding: true, style: st, attr: { width: '64', height: '18', style: 'border:0;vertical-align:middle;width:auto;max-width:64px' } };
      window.goatcounter.visit_count({ ...opt, append: '#gcT', start: d, end: d });
      window.goatcounter.visit_count({ ...opt, append: '#gcA' });
    }, 200);
  });
})();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let items = [];
function render(q) {
  const list = q ? items.filter(x => String(x.no).startsWith(q)) : items;
  if (!list.length) { document.getElementById('list').innerHTML = `<p class="empty">${q ? q + '번 상품이 없어요' : '아직 상품이 없어요'}</p>`; return; }
  let last = '';
  document.getElementById('list').innerHTML = list.map(x => {
    const head = !q && x.date !== last ? `<div class="date">${esc(x.date)}</div>` : '';
    last = x.date;
    return head + `<a class="item" id="n${esc(x.no)}" href="${esc(x.link)}" target="_blank" rel="noopener sponsored" data-goatcounter-click="pick-${esc(x.no)}" data-goatcounter-title="${esc(x.no)}번 ${esc(x.name)}">
      <div class="no">${esc(x.no)}</div>
      ${x.image ? `<img src="${esc(x.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
      <div class="txt"><div class="nm">${esc(x.name)}</div>${x.line ? `<div class="ln">${esc(x.line)}</div>` : ''}<span class="go">쿠팡에서 보기 →</span></div>
    </a>`;
  }).join('');
}
document.getElementById('q').addEventListener('input', e => render(e.target.value.replace(/\D/g, '')));
fetch('picks.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : { items: [] }).catch(() => ({ items: [] })).then(d => {
  items = d.items || [];
  render('');
  const h = location.hash.replace(/\D/g, '');
  if (h) { const el = document.getElementById('n' + h); if (el) { el.classList.add('hl'); el.scrollIntoView({ block: 'center' }); } }
});
</script>
</body>
</html>
